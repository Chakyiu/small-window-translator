name: Package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macos-aarch64
            formats: app,dmg
          - os: macos-13
            label: macos-x86_64
            formats: app,dmg
          - os: windows-latest
            label: windows-x86_64
            formats: nsis
          - os: windows-11-arm
            label: windows-arm64
            formats: nsis
          - os: ubuntu-22.04
            label: linux-x86_64
            formats: appimage,deb
          - os: ubuntu-22.04-arm
            label: linux-arm64
            formats: appimage,deb

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: packager-${{ matrix.label }}

      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config clang \
            libx11-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxdo-dev libxi-dev libxrandr-dev \
            libwayland-dev libasound2-dev \
            libayatana-appindicator3-dev libfontconfig1-dev libfreetype6-dev \
            libssl-dev

      - name: Install cargo-packager
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-packager@0.11.7

      - name: Package
        shell: bash
        run: cargo packager --release --formats "${{ matrix.formats }}"

      - name: Zip macOS .app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          shopt -s nullglob
          for app in target/packager/*.app; do
            ditto -c -k --keepParent "$app" "${app%.app}-${{ matrix.label }}.zip"
          done

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: swtrans-${{ matrix.label }}
          path: |
            target/packager/*.dmg
            target/packager/*.zip
            target/packager/*.exe
            target/packager/*.msi
            target/packager/*.AppImage
            target/packager/*.deb
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
