[package]
name = "swtrans"
version = "0.4.0"
edition = "2024"
description = "Small Window Translator — select-text translator for macOS, Windows, and Linux"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1"
arboard = "3.6"
directories = "6"
enigo = "0.6"
global-hotkey = "0.8"
on-selected-text = "0.1.6"
cpal = "0.18.2"
hound = "3.5"
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "json",
    "multipart",
    "rustls-tls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
tray-icon = "0.24"
auto-launch = "0.5"
urlencoding = "2"
whatlang = "0.18"

[target.'cfg(target_os = "macos")'.dependencies]
gpui = { version = "0.2.2", features = ["macos-blade"] }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
gpui = "0.2.2"

[package.metadata.packager]
product-name = "Small Window Translator"
identifier = "dev.swtrans.app"
publisher = "swtrans"
category = "Reference"
out-dir = "target/packager"
binaries-dir = "target/release"
before-packaging-command = "cargo build --release"
icons = [
    "resources/icons/32x32.png",
    "resources/icons/128x128.png",
    "resources/icons/128x128@2x.png",
    "resources/icons/256x256.png",
    "resources/icons/512x512.png",
]
long-description = "Select text in any app, press a hotkey, and translate it. DeepL, OpenAI-compatible, LibreTranslate, and unofficial Google."

[[package.metadata.packager.binaries]]
path = "swtrans"
main = true

[package.metadata.packager.macos]
background-app = true
minimum-system-version = "11.0"
info-plist-path = "resources/Info.plist"
signing-identity = "-"

[package.metadata.packager.linux]
generate-desktop-entry = true

[package.metadata.packager.deb]
section = "utils"
depends = [
    "libxkbcommon0",
    "libx11-6",
    "libasound2",
    "libayatana-appindicator3-1",
]
